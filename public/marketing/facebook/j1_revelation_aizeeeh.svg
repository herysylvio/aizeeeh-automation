        </text>
      </g>

      <!-- Message Lancement Demain -->
      <g transform="translate(540, 830)">
        <rect x="-380" y="-40" width="760" height="80" rx="40" fill="#ff6b6b" filter="url(#shadow3)" />
        <text x="0" y="12" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" text-anchor="middle" letter-spacing="1">
