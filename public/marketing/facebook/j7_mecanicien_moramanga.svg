<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
      <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#0a1931" />
          <stop offset="100%" stop-color="#060e1d" />
        </linearGradient>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4" />
        </filter>
      </defs>

      <!-- Fond -->
      <rect width="1080" height="1080" fill="url(#bgGrad)" />

      <!-- Cercles d'ambiance géométriques -->
      <circle cx="940" cy="140" r="320" fill="#ff6b6b" opacity="0.08" />
      <circle cx="120" cy="960" r="260" fill="#ffeac1" opacity="0.05" />

      <!-- Badge En-tête -->
      <g transform="translate(80, 80)">
        <rect width="320" height="56" rx="28" fill="#ff6b6b" fill-opacity="0.15" stroke="#ff6b6b" stroke-width="2"/>
        <text x="160" y="36" fill="#ff6b6b" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="22" text-anchor="middle" letter-spacing="2">ENQUÊTE LOCALE • 514</text>
      </g>

      <!-- Tag Ville -->
      <text x="1000" y="118" fill="#b0b8c4" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" text-anchor="end">📍 MORAMANGA</text>

      <!-- Illustration Centrale -->
      <g transform="translate(540, 430)" filter="url(#shadow)">
        <!-- Disque de fond -->
        <circle cx="0" cy="0" r="190" fill="#112445" stroke="#1d355e" stroke-width="6"/>
        <circle cx="0" cy="0" r="160" fill="#ff6b6b" opacity="0.1"/>

        <!-- Clé mécanique et Pin croisés stylisés -->
        <path d="M-50,60 L50,-40 M-30,80 L30,-20 M-60,50 L40,-50" stroke="#ff6b6b" stroke-width="28" stroke-linecap="round" />
        <circle cx="-65" cy="75" r="28" fill="none" stroke="#ff6b6b" stroke-width="18" />
        
        <!-- Pin Location Corail & Blanc -->
        <g transform="translate(25, -20)">
          <path d="M0,-80 C44,-80 80,-44 80,0 C80,55 0,110 0,110 C0,110 -80,55 -80,0 C-80,-44 -44,-80 0,-80 Z" fill="#ff6b6b" />
          <circle cx="0" cy="-5" r="30" fill="#ffffff" />
        </g>
      </g>

      <!-- Carte Question Principale -->
      <g transform="translate(80, 680)">
        <rect width="920" height="240" rx="24" fill="#0f203c" stroke="#1a3156" stroke-width="2" filter="url(#shadow)" />
        
        <text x="460" y="75" fill="#ffeac1" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" text-anchor="middle" letter-spacing="1">
          SENDRA NY MAFY HARIVA ? 🏍️
        </text>

        <text x="460" y="140" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" text-anchor="middle">
          AIZA NO MISY MÉCANO AFAKA
        </text>
        <text x="460" y="195" fill="#ff6b6b" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" text-anchor="middle">
          MANAO DÉPANNAGE MAIKA ?
        </text>
      </g>

      <!-- Bas de page : Appel à l'action -->
      <g transform="translate(540, 990)">
        <text x="0" y="0" fill="#b0b8c4" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" text-anchor="middle">
          👇 Zarao amin'ny commentaire ny adiresy sy numéro fantatrareo !
        </text>
      </g>
    </svg>