<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
      <defs>
        <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#071224" />
          <stop offset="100%" stop-color="#020710" />
        </linearGradient>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="16" result="blur" />
          <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
        </filter>
      </defs>

      <rect width="1080" height="1080" fill="url(#bgGrad2)" />

      <!-- Ciel nocturne étoilé subtil -->
      <circle cx="200" cy="180" r="3" fill="#ffffff" opacity="0.6"/>
      <circle cx="850" cy="140" r="4" fill="#ffffff" opacity="0.7"/>
      <circle cx="920" cy="300" r="3" fill="#ffffff" opacity="0.4"/>
      <circle cx="150" cy="450" r="3.5" fill="#ffffff" opacity="0.5"/>

      <!-- Badge Urgent -->
      <g transform="translate(80, 80)">
        <rect width="360" height="56" rx="28" fill="#ff6b6b" fill-opacity="0.2" stroke="#ff6b6b" stroke-width="2"/>
        <text x="180" y="36" fill="#ff6b6b" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="20" text-anchor="middle" letter-spacing="2">URGENCE SANTÉ • MORAMANGA</text>
      </g>

      <!-- Symbole Pharmacie Lumineux -->
      <g transform="translate(540, 410)" filter="url(#shadow2)">
        <circle cx="0" cy="0" r="190" fill="#0c1f3d" stroke="#16325c" stroke-width="4"/>
        
        <!-- Croix Verte/Corail lumineuse -->
        <g filter="url(#glow)">
          <rect x="-35" y="-110" width="70" height="220" rx="16" fill="#ff6b6b" />
          <rect x="-110" y="-35" width="220" height="70" rx="16" fill="#ff6b6b" />
        </g>
        <rect x="-24" y="-95" width="48" height="190" rx="12" fill="#ffffff" />
        <rect x="-95" y="-24" width="190" height="48" rx="12" fill="#ffffff" />
        
        <!-- Croissant de Lune / Nuit -->
        <path d="M70,-110 A 50 50 0 0 0 120,-60 A 60 60 0 1 1 70,-110 Z" fill="#ffeac1" opacity="0.9" />
      </g>

      <!-- Carte Question Principale -->
      <g transform="translate(80, 680)">
        <rect width="920" height="240" rx="24" fill="#0c1d36" stroke="#1c3761" stroke-width="2" filter="url(#shadow2)" />
        
        <text x="460" y="70" fill="#ffeac1" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="32" text-anchor="middle" letter-spacing="1">
          MARARY TAMPOKA AMIN'NY ALINA ? 💊
        </text>

        <text x="460" y="138" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="42" text-anchor="middle">
          PHARMACIE DE GARDE ANIO :
        </text>
        <text x="460" y="195" fill="#ff6b6b" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" text-anchor="middle">
          AHOANA NO FAHITA AZY ?
        </text>
      </g>

      <g transform="translate(540, 990)">
        <text x="0" y="0" fill="#b0b8c4" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="24" text-anchor="middle">
          Mbola mandeha mitsapa eny an-toerana ve sa efa manana numéro ? 👇
        </text>
      </g>
    </svg>